name: get.omo.dev deploy

on:
  push:
    branches: [dev]
    paths:
      - "packages/get-worker/**"
      - ".github/workflows/get-worker-deploy.yml"
  workflow_dispatch:

concurrency:
  group: get-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'code-yeongyu/oh-my-openagent'
    runs-on: ubuntu-latest
    environment:
      name: web-production
      url: https://get.omo.dev
    defaults:
      run:
        working-directory: packages/get-worker
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/get-worker
          command: d1 migrations apply omo-get --remote
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/get-worker
          command: deploy
      - name: Smoke the live endpoints
        run: |
          set -euo pipefail
          curl -fsS https://get.omo.dev/healthz
          curl -fsSI https://get.omo.dev/install.sh | grep -i '^cache-control: public, max-age=300'
          curl -fsS https://get.omo.dev/channels/latest
